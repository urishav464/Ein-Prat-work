:root{
  --paper:#f4efe3;
  --ink:#463a26;
  --ink-soft:#6f6045;
  --rule:#b3a077;
  --surround:#232019;
  --serif:"Frank Ruhl Libre","Frank Ruehl CLM","David CLM","Times New Roman",serif;
  --sans:"Assistant","Alef","Arial Hebrew",Arial,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--surround);
  display:flex;justify-content:center;padding:24px 16px;
  font-family:var(--sans);
}
.sheet{
  position:relative;width:min(100%,780px);aspect-ratio:210/297;
  container-type:inline-size;overflow:hidden;background:var(--paper);
  box-shadow:0 20px 64px rgba(0,0,0,.55);direction:rtl;
}
.sheet__photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:34% 50%;display:block;
}
.sheet__veil{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(255,253,247,.40) 0%,
    rgba(255,253,247,.30) 24%,
    rgba(255,253,247,.44) 42%,
    rgba(255,253,247,.52) 58%,
    rgba(255,253,247,.46) 72%,
    rgba(255,253,247,.30) 88%,
    rgba(255,253,247,.36) 100%);
}

.sheet__body{
  position:relative;height:100%;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:5cqw 7cqw 4.2cqw;color:var(--ink);
}
.meta{font-size:2.4cqw;letter-spacing:.06em;color:var(--ink-soft);}

.core{display:flex;flex-direction:column;align-items:center;text-align:center;}
.eyebrow{font-size:3cqw;letter-spacing:.14em;color:var(--ink-soft);}
.title{
  font-family:var(--serif);font-weight:700;font-size:12.4cqw;
  line-height:1;letter-spacing:.005em;margin:1.4cqw 0 0;
  text-wrap:balance;text-shadow:0 .4cqw 1.6cqw rgba(255,255,255,.6);
}
.date{
  display:flex;align-items:center;gap:2.2cqw;margin-top:2.8cqw;
  font-size:3.05cqw;letter-spacing:.04em;color:var(--ink-soft);
}
.date::before,.date::after{content:"";width:8cqw;height:1px;background:var(--rule);opacity:.75;}
.date b{font-weight:700;color:var(--ink);}
.date span[dir=ltr]{font-variant-numeric:tabular-nums;}

.schedule{
  margin:8.5cqw 0 0;padding:0;list-style:none;
  display:grid;gap:6.4cqw;width:100%;max-width:74cqw;
}
.slot{display:grid;grid-template-columns:18cqw 1fr;align-items:baseline;gap:2.4cqw;text-align:right;}
.slot__time{
  font-size:2.85cqw;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);direction:ltr;unicode-bidi:isolate;text-align:left;white-space:nowrap;
}
.slot__what{font-size:3.05cqw;line-height:1.3;color:var(--ink);}
.slot__time,.slot__what{text-shadow:0 .12cqw .7cqw rgba(255,253,247,.85);}
.slot--quiet .slot__what{color:var(--ink-soft);}
.slot--quiet .slot__time{color:var(--ink-soft);font-weight:400;}

.foot{display:flex;flex-direction:column;align-items:center;gap:3.2cqw;}
.closing{
  font-family:var(--serif);font-weight:700;font-size:4.8cqw;letter-spacing:.02em;
  color:var(--ink);text-shadow:0 .35cqw 1.4cqw rgba(255,255,255,.55);
}
.logo{position:relative;width:14cqw;height:14cqw;border-radius:50%;}
.logo__slot{
  position:absolute;inset:0;border:1px dashed var(--rule);border-radius:50%;
  display:grid;place-items:center;font-size:2.1cqw;color:var(--ink-soft);
  background:rgba(255,255,255,.32);
}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}

@media print{
  @page{size:A4 portrait;margin:0;}
  body{background:#fff;padding:0;display:block;}
  .sheet{width:210mm;height:297mm;max-width:none;box-shadow:none;}
}
</style>
