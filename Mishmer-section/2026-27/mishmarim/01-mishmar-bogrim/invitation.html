:root{ --ink:#3e3426; --ink-soft:#6b5c42; --rule:#a8956f; --surround:#232019; }
*{box-sizing:border-box;}
body{margin:0;background:var(--surround);display:flex;justify-content:center;padding:24px 16px;}
.sheet{
  position:relative;width:min(100%,860px);aspect-ratio:210/297;
  container-type:inline-size;overflow:hidden;background:#efe9dc;
  box-shadow:0 20px 64px rgba(0,0,0,.55);direction:rtl;
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.veil{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(255,253,247,.42) 0%,  rgba(255,253,247,.30) 22%,
    rgba(255,253,247,.42) 40%, rgba(255,253,247,.50) 58%,
    rgba(255,253,247,.44) 74%, rgba(255,253,247,.32) 90%,
    rgba(255,253,247,.38) 100%);
}
.body{
  position:relative;height:100%;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:4.4cqw 5cqw 4cqw;color:var(--ink);
}
.meta{
  font-family:"NotoHe",sans-serif;font-stretch:62.5%;font-weight:500;
  font-size:3.4cqw;color:var(--ink-soft);
}
.core{display:flex;flex-direction:column;align-items:center;text-align:center;}
.eyebrow{
  font-family:"NotoHe",sans-serif;font-stretch:62.5%;font-weight:500;
  font-size:5.6cqw;letter-spacing:.04em;color:var(--ink-soft);
}
.title{
  font-family:"Heebo",sans-serif;font-weight:900;font-size:15.5cqw;
  line-height:1;margin:1cqw 0 0;letter-spacing:-.01em;
  text-shadow:0 .4cqw 1.7cqw rgba(255,253,247,.72);
}
.date{
  display:flex;align-items:center;gap:2cqw;margin-top:2.4cqw;
  font-family:"NotoHe",sans-serif;font-stretch:62.5%;font-weight:700;
  font-size:4.9cqw;color:var(--ink);
  text-shadow:0 .2cqw 1cqw rgba(255,253,247,.85);
}
.date::before,.date::after{content:"";width:7cqw;height:.2cqw;background:var(--rule);opacity:.85;}
.date .g{font-variant-numeric:tabular-nums;}

.schedule{
  margin:auto 0 7.5cqw;padding:0;list-style:none;
  display:grid;gap:3.9cqw;width:100%;max-width:90cqw;text-align:right;
}
.schedule li{
  font-family:"NotoHe",sans-serif;font-stretch:62.5%;font-weight:500;
  font-size:5.1cqw;line-height:1.1;color:var(--ink);
  text-shadow:0 .16cqw 1cqw rgba(255,253,247,.92);
}
.schedule li.quiet{color:var(--ink-soft);}
.schedule .t{font-weight:700;font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;}

.foot{display:flex;flex-direction:column;align-items:center;gap:2.4cqw;}
.closing{
  font-family:"Heebo",sans-serif;font-weight:900;font-size:5.9cqw;
  color:var(--ink);text-shadow:0 .35cqw 1.5cqw rgba(255,253,247,.72);
}
.logo{width:19cqw;height:auto;display:block;}

@media print{
  @page{size:A4 portrait;margin:0;}
  body{background:#fff;padding:0;display:block;}
  .sheet{width:210mm;height:297mm;max-width:none;box-shadow:none;}
}
</style>
